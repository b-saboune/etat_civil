spring:
  application:
    name: civilis-backend
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

civilis:
  jwt:
    secret: ${CIVILIS_JWT_SECRET:changeme-dev-secret-change-in-production-please-0123456789}
    access-token-minutes: 30
    refresh-token-days: 7
  securite:
    max-tentatives-echec: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html
